<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Render Service Test</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        h1 { font-size: 20px; margin-bottom: 24px; }

        .event-block { border: 1px solid #ccc; border-radius: 6px; padding: 16px; margin-bottom: 16px; }
        .event-block h3 { margin: 0 0 12px; font-size: 14px; color: #555; }

        label { display: block; font-size: 12px; color: #888; margin: 10px 0 2px; }
        label:first-of-type { margin-top: 0; }
        input, textarea { width: 100%; box-sizing: border-box; padding: 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; }
        textarea { resize: vertical; min-height: 72px; }
        .hint { font-size: 11px; color: #aaa; margin-top: 2px; }

        .actions { display: flex; gap: 8px; margin-top: 20px; }
        button { padding: 10px 20px; font-size: 14px; border: none; border-radius: 4px; cursor: pointer; }
        #renderBtn  { background: #288bc4; color: white; flex: 1; }
        #renderBtn:disabled { opacity: 0.6; cursor: not-allowed; }

        #status { margin-top: 12px; font-size: 13px; color: #888; }

        /* modal */
        #previewModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; }
        #previewModal.active { display: flex; }
        .modal-box { background: white; width: 90%; max-width: 700px; height: 85vh; display: flex; flex-direction: column; border-radius: 8px; overflow: hidden; }
        .modal-header { padding: 14px 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .modal-header h2 { font-size: 16px; margin: 0; }
        #previewFrame { flex: 1; border: none; width: 100%; }
        .modal-footer { padding: 12px 20px; border-top: 1px solid #eee; display: flex; gap: 8px; justify-content: flex-end; }
        #closeBtn    { background: #eee; color: #333; }
        #dispatchBtn { background: #22c55e; color: white; }
        #dispatchBtn:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body>

<h1>Render Service Test</h1>
<div id="eventsForm"></div>
<button id="renderBtn" onclick="submitRender()">Render Preview</button>
<div id="status"></div>

<div id="previewModal">
    <div class="modal-box">
        <div class="modal-header">
            <h2>Email Preview</h2>
            <span style="cursor:pointer;font-size:20px;" onclick="closeModal()">&times;</span>
        </div>
        <iframe id="previewFrame"></iframe>
        <div class="modal-footer">
            <button id="closeBtn" onclick="closeModal()">Cancel</button>
            <button id="dispatchBtn" onclick="confirmDispatch()">✅ Dispatch</button>
        </div>
    </div>
</div>

<script>
const RENDER_URL     = 'http://localhost:8002/render';
const DISPATCHER_URL = 'http://localhost:8080/app/v1';

const FIELDS = [
    { key: 'title',   label: '標題',   type: 'input' },
    { key: 'date',    label: '發生時間', type: 'textarea', hint: '一行一項' },
    { key: 'scope',   label: '影響範圍', type: 'textarea', hint: '一行一項' },
    { key: 'impact',  label: '潛在影響', type: 'textarea', hint: '一行一項' },
    { key: 'summary', label: '重點整理', type: 'textarea', hint: '一行一段' },
    { key: 'url',     label: '網址',   type: 'input' },
];

let pendingHtml = null;

function buildForm() {
    document.getElementById('eventsForm').innerHTML = [0,1,2].map(i => `
        <div class="event-block">
            <h3>Event ${i+1}</h3>
            ${FIELDS.map(f => `
                <label>${f.label}</label>
                ${f.type === 'textarea'
                    ? `<textarea id="e${i}_${f.key}" rows="2"></textarea>`
                    : `<input type="text" id="e${i}_${f.key}">`}
                ${f.hint ? `<div class="hint">${f.hint}</div>` : ''}
            `).join('')}
        </div>`).join('');
}

function collectEvent(i) {
    const get   = k => document.getElementById(`e${i}_${k}`).value.trim();
    const lines = k => get(k).split('\n').map(l => l.trim()).filter(Boolean);
    return {
        title:   [get('title')],
        date:    lines('date'),
        scope:   lines('scope'),
        impact:  lines('impact'),
        summary: lines('summary'),
        url:     get('url') || '#',
    };
}

function setStatus(msg) { document.getElementById('status').textContent = msg; }

async function submitRender() {
    const btn = document.getElementById('renderBtn');
    const events = [0,1,2].map(collectEvent);
    for (let i = 0; i < 3; i++) {
        if (!events[i].title[0]) { setStatus(`Event ${i+1} 標題不能為空`); return; }
    }
    btn.disabled = true;
    btn.textContent = 'Rendering...';
    setStatus('');
    try {
        const res = await fetch(RENDER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ events }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const { html } = await res.json();
        pendingHtml = html;
        document.getElementById('previewFrame').srcdoc = html;
        document.getElementById('previewModal').classList.add('active');
    } catch (err) {
        setStatus('Render failed: ' + err.message);
    } finally {
        btn.disabled = false;
        btn.textContent = 'Render Preview';
    }
}

async function confirmDispatch() {
    if (!pendingHtml) return;
    const btn = document.getElementById('dispatchBtn');
    btn.disabled = true;
    btn.textContent = 'Dispatching...';
    try {
        const res = await fetch(DISPATCHER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ html: pendingHtml }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        pendingHtml = null;
        closeModal();
        setStatus('Dispatch successful ✓');
    } catch (err) {
        setStatus('Dispatch failed: ' + err.message);
    } finally {
        btn.disabled = false;
        btn.textContent = ' Dispatch';
    }
}

function closeModal() { document.getElementById('previewModal').classList.remove('active'); }

buildForm();
</script>
</body>
</html>
