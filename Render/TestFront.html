<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Render Service Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f1117;
            --bg-card: #21242f;
            --bg-input: #181b24;
            --border: #2a2e3b;
            --text-primary: #e8eaed;
            --text-secondary: #9aa0ab;
            --text-muted: #6b7280;
            --accent: #288bc4;
            --radius: 10px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 40px 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }

        h1 { text-align: center; font-size: 22px; margin-bottom: 8px; }
        .subtitle { text-align: center; color: var(--text-muted); font-size: 13px; margin-bottom: 32px; }

        .event-block {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 20px;
        }
        .event-header {
            font-size: 15px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input, textarea {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            padding: 10px 12px;
            margin-bottom: 14px;
            resize: vertical;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }
        textarea { min-height: 80px; }
        .hint { font-size: 11px; color: var(--text-muted); margin: -10px 0 14px 0; }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent), #1e6fa0);
            color: white;
            border: none;
            border-radius: 6px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
        }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .preview-frame {
            display: none;
            width: 100%;
            height: 800px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-top: 24px;
            background: white;
        }
        .status-msg {
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Render Service Test</h1>
    <p class="subtitle">POST /render → preview email HTML</p>

    <div id="eventsForm"></div>

    <button class="btn" onclick="submitRender()">Render Email</button>
    <div class="status-msg" id="status"></div>

    <iframe class="preview-frame" id="preview"></iframe>
</div>

<script>
const RENDER_URL = 'http://localhost:8002/render';
const FIELDS = [
    { key: 'title',   label: '標題 Title',          type: 'input' },
    { key: 'date',    label: '發生時間 Date',         type: 'textarea', hint: '一行一項' },
    { key: 'scope',   label: '影響範圍 Scope',        type: 'textarea', hint: '一行一項' },
    { key: 'impact',  label: '潛在影響 Impact',       type: 'textarea', hint: '一行一項' },
    { key: 'summary', label: '重點整理 Summary',      type: 'textarea', hint: '一行一段' },
    { key: 'url',     label: '新聞網址 URL',          type: 'input' },
];

function buildForm() {
    const container = document.getElementById('eventsForm');
    let html = '';
    for (let i = 0; i < 3; i++) {
        html += `<div class="event-block">`;
        html += `<div class="event-header">Event ${i + 1}</div>`;
        FIELDS.forEach(f => {
            html += `<label>${f.label}</label>`;
            if (f.type === 'textarea') {
                html += `<textarea id="e${i}_${f.key}"></textarea>`;
            } else {
                html += `<input type="text" id="e${i}_${f.key}">`;
            }
            if (f.hint) html += `<div class="hint">${f.hint}</div>`;
        });
        html += `</div>`;
    }
    container.innerHTML = html;
}

function collectEvent(i) {
    const get = (key) => document.getElementById(`e${i}_${key}`).value.trim();
    const lines = (key) => get(key).split('\n').map(l => l.trim()).filter(Boolean);
    return {
        title:   [get('title')],
        date:    lines('date'),
        scope:   lines('scope'),
        impact:  lines('impact'),
        summary: lines('summary'),
        url:     get('url') || '#',
    };
}

async function submitRender() {
    const status = document.getElementById('status');
    const preview = document.getElementById('preview');
    const btn = document.querySelector('.btn');

    const events = [collectEvent(0), collectEvent(1), collectEvent(2)];

    // 基本檢查
    for (let i = 0; i < 3; i++) {
        if (!events[i].title[0]) {
            status.textContent = `Event ${i + 1} 的標題不能為空`;
            status.style.color = '#ff4d4d';
            return;
        }
    }

    btn.disabled = true;
    status.textContent = 'Rendering...';
    status.style.color = 'var(--text-muted)';

    try {
        const res = await fetch(RENDER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ events }),
        });

        if (!res.ok) {
            const err = await res.json();
            throw new Error(err.detail || res.statusText);
        }

        const data = await res.json();
        preview.srcdoc = data.html;
        preview.style.display = 'block';
        status.textContent = `200 OK · ${data.html.length} chars`;
        status.style.color = '#4ade80';
    } catch (err) {
        status.textContent = `Error: ${err.message}`;
        status.style.color = '#ff4d4d';
        preview.style.display = 'none';
    } finally {
        btn.disabled = false;
    }
}

buildForm();
</script>
</body>
</html>
