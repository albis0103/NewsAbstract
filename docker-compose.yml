

services:
  frontend-ui:
    image: nginx:alpine
    container_name: news-frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    restart: "no"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-broker
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      # --- KRaft 核心配置 ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      
      # --- 監聽器配置  ---
      KAFKA_LISTENERS: 'PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      
      # --- 穩定性配置  ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    restart: "no"
  n8n-workflow:
    image: n8nio/n8n:2.18.6
    container_name: n8n-workflow
    ports: 
      - "5678:5678"
    environment:
      - N8N_PROTOCOL=http
      - N8N_PORT=5678
      - N8N_CORS_ENABLED=true
      - N8N_CORS_ORIGINS
    volumes:
      - n8n_data:/home/node/.n8n
    restart: "no"

  render-service:
    build: ./Render
    container_name: render-service
    ports:
      - "8002:8002"
    restart: "no"
  news-nlp-services:
    image: news-nlp-api:latest
    container_name: news-nlp-service
    # if not docker public image, need to build:path(saved python docker file directory name)
    build: ./news-analyzer-py
    ports: 
      - "8000:8000"
    env_file:
      - ./news-analyzer-py/.env
    volumes:
      - ./news-analyzer-py/models:/app/models
    restart: "no"
  
  news-dispatcher-service:
    image: news-dispatcher-api:latest
    container_name: news-dispatcher-service
    # if not docker public image, need to build:path(saved Java docker file directory name)
    build: ./news-dispatcher
    ports: 
      - "8080:8080"
    env_file:
      - ./news-dispatcher/.env
    restart: "no"
    
  dashboard-api:
    build: ./dashboard-api
    container_name: dashboard-api
    ports: 
      - "8001:8001"
    env_file:
      - ./dashboard-api/.env
    environment: 
      - KAFKA_BROKER=kafka:29092
    depends_on:
      - kafka
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/')"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: "no"
  news-crawler:
    build: ./news-crawler
    environment:
      - PYTHONUNBUFFERED=1
      - KAFKA_BROKER=kafka:29092
      - API_URL=http://dashboard-api:8001/api/rss-sources
    depends_on:
      dashboard-api:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: "on-failure"
volumes:
 n8n_data: