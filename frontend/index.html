<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecOps Intelligence - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f1117;
            --bg-card: #21242f;
            --bg-card-hover: #282c3a;
            --bg-input: #181b24;
            --border: #2a2e3b;
            --text-primary: #e8eaed;
            --text-secondary: #9aa0ab;
            --text-muted: #6b7280;
            --accent: #288bc4;
            --success: #22c55e;
            --danger: #ef4444;
            --radius: 10px;
            --radius-sm: 6px;
            --shadow: 0 8px 30px rgba(0,0,0,0.5);
            --transition: 0.2s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { width: 100%; max-width: 1200px; }

        /* ===== HEADER ===== */
        .header { text-align: center; margin-bottom: 40px; }
        .logo { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        .status { color: var(--accent); font-size: 13px; font-weight: 500; }

        /* ===== DIGEST QUEUE BAR ===== */
        .queue-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 20px;
            margin-bottom: 24px;
            gap: 16px;
        }
        .queue-label { font-size: 13px; color: var(--text-secondary); }
        .queue-slots { display: flex; gap: 8px; }
        .queue-slot {
            width: 32px; height: 32px;
            border-radius: 6px;
            border: 1px dashed var(--border);
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; color: var(--text-muted);
            transition: all var(--transition);
        }
        .queue-slot.filled {
            background: rgba(40,139,196,0.15);
            border: 1px solid var(--accent);
            color: var(--accent);
            font-weight: 700;
        }
        .queue-clear-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 12px;
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-family: inherit;
            transition: all var(--transition);
        }
        .queue-clear-btn:hover { border-color: var(--danger); color: var(--danger); }

        /* ===== FEED GRID ===== */
        #feed {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            width: 100%;
        }

        .card {
            background: var(--bg-card);
            padding: 24px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            text-align: left;
            transition: transform var(--transition), border-color var(--transition);
            display: flex;
            flex-direction: column;
            height: 100%;
            cursor: pointer;
            position: relative;
        }
        .card:hover { transform: translateY(-4px); border-color: var(--accent); }
        .card.in-queue { border-color: var(--accent); }
        .card .queue-badge {
            position: absolute;
            top: 12px; right: 12px;
            background: var(--accent);
            color: white;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 10px;
            display: none;
        }
        .card.in-queue .queue-badge { display: block; }

        .tag-container { margin-bottom: 12px; }
        .tag {
            background: rgba(40, 139, 196, 0.1);
            color: var(--accent);
            border: 1px solid rgba(40, 139, 196, 0.2);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            margin-right: 6px;
            text-transform: uppercase;
            display: inline-block;
            margin-bottom: 4px;
        }
        .title { font-size: 16px; font-weight: 600; margin-bottom: 10px; line-height: 1.4; }
        .summary {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* ===== SETTINGS ===== */
        #settingsPanel {
            display: none;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 40px;
            width: 100%;
            max-width: 800px;
        }

        /* ===== MODAL BASE ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active { display: flex; opacity: 1; }

        /* ===== NEWS PREVIEW MODAL ===== */
        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            width: 90%;
            max-width: 600px;
            padding: 32px;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }

        .close-btn {
            position: absolute;
            top: 20px; right: 24px;
            background: none; border: none;
            color: var(--text-muted);
            font-size: 24px; cursor: pointer;
            transition: color var(--transition);
        }
        .close-btn:hover { color: var(--text-primary); }

        .modal-title { font-size: 20px; font-weight: 600; margin-bottom: 16px; line-height: 1.4; padding-right: 20px; }
        .modal-body { color: var(--text-secondary); font-size: 15px; line-height: 1.6; margin-bottom: 24px; max-height: 30vh; overflow-y: auto; }

        /* ===== DIGEST EDITOR MODAL ===== */
        .digest-modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            width: 95%;
            max-width: 1100px;
            height: 90vh;
            padding: 0;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            transform: translateY(20px);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .modal-overlay.active .digest-modal-content { transform: translateY(0); }

        .digest-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 28px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .digest-modal-header h2 { font-size: 18px; font-weight: 700; }
        .digest-modal-body {
            display: flex;
            gap: 0;
            flex: 1;
            overflow: hidden;
        }

        /* Editor pane */
        .editor-pane {
            flex: 3;
            display: flex;
            flex-direction: column;
            padding: 24px 28px;
            overflow-y: auto;
            border-right: 1px solid var(--border);
        }
        .field-group { display: flex; flex-direction: column; gap: 6px; flex: 1; }
        .field-group label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-top: 12px;
        }
        .field-group label:first-child { margin-top: 0; }
        .field-group input,
        .field-group textarea {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            line-height: 1.6;
            transition: border-color var(--transition);
        }
        .field-group textarea { resize: vertical; min-height: 72px; }
        .field-group input:focus,
        .field-group textarea:focus { outline: none; border-color: var(--accent); }

        /* Similarity pane */
        .similarity-pane {
            flex: 1;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            padding: 24px 20px;
            overflow-y: auto;
        }
        .similarity-pane h3 {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .customer-card { margin-bottom: 14px; }
        .label-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px; }
        .label-name { color: var(--text-primary); font-weight: 500; }
        .progress-container {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 10px;
            height: 8px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.8s cubic-bezier(0.1,0,0.2,1);
        }
        .similarity-source { font-size: 11px; color: var(--text-muted); margin-top: auto; padding-top: 16px; text-align: center; }

        /* Footer actions */
        .digest-modal-footer {
            display: flex;
            gap: 12px;
            padding: 16px 28px;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        /* ===== BUTTONS ===== */
        .action-btn {
            background: linear-gradient(135deg, var(--accent), #1e6fa0);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all var(--transition);
            width: 100%;
            display: block;
            text-align: center;
        }
        .action-btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .action-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 11px 20px;
            border: none; border-radius: var(--radius-sm);
            font-size: 14px; font-weight: 600; font-family: inherit;
            cursor: pointer; transition: all var(--transition); flex: 1;
        }
        .btn-secondary {
            background: var(--bg-input); color: var(--text-primary); border: 1px solid var(--border);
        }
        .btn-secondary:hover { border-color: var(--accent); }
        .btn-success { background: var(--success); color: #fff; }
        .btn-success:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .source-link {
            display: block; text-align: center; margin-top: 16px;
            color: var(--text-muted); font-size: 13px; text-decoration: underline;
        }
        .source-link:hover { color: var(--text-primary); }

        /* ===== MISC ===== */
        @media (max-width: 992px) { #feed { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { #feed { grid-template-columns: 1fr; } }
        .loading { grid-column: 1 / -1; text-align: center; color: var(--text-muted); margin-top: 50px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo">SecOps AI Intelligence</div>
        <div class="status" id="statusText">Live Threat Feed • Updating...</div>
        <button onclick="toggleSettings()" class="action-btn" style="width:auto;margin-top:20px;font-size:13px;padding:10px 20px;background:var(--bg-input);border:1px solid var(--border);">
             Manage RSS Sources
        </button>
    </div>

    <div id="settingsPanel">
        <h3 style="font-size:18px;margin-bottom:20px;">Source Management</h3>
        <div style="display:flex;gap:10px;margin-bottom:24px;">
            <input type="text" id="newRssUrl" placeholder="https://example.com/rss..." style="margin-bottom:0;background:var(--bg-input);flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:6px;color:var(--text-primary);font-family:inherit;">
            <button onclick="addNewRss()" style="width:auto;padding:0 20px;background:var(--accent);color:white;border:none;border-radius:6px;font-family:inherit;font-weight:600;cursor:pointer;">Add Source</button>
        </div>
        <div id="sourceList" style="border-top:1px solid var(--border);padding-top:20px;">
            <div class="loading" style="margin-top:0;">Loading sources...</div>
        </div>
    </div>

    <!-- Digest Queue Bar -->
    <div class="queue-bar">
        <span class="queue-label">News Queue</span>
        <div class="queue-slots">
            <div class="queue-slot" id="slot0">1</div>
            <div class="queue-slot" id="slot1">2</div>
            <div class="queue-slot" id="slot2">3</div>
        </div>
        <button class="queue-clear-btn" onclick="clearQueue()">Clean queue</button>
    </div>

    <div id="feed"><div class="loading">Fetching data...</div></div>
</div>

<!-- News Preview Modal -->
<div class="modal-overlay" id="newsModal" onclick="closeNewsModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <button class="close-btn" onclick="closeNewsModal(event)">&times;</button>
        <div id="modalTags" class="tag-container"></div>
        <div id="modalTitle" class="modal-title"></div>
        <div id="modalSummary" class="modal-body"></div>
        <button id="analyzeBtn" class="action-btn">Analyze and Generate Digest</button>
        <a id="modalSourceLink" href="#" target="_blank" class="source-link">Read Original Article</a>
    </div>
</div>

<!-- Digest Editor Modal -->
<div class="modal-overlay" id="digestModal" onclick="closeDigestModal(event)">
    <div class="digest-modal-content" onclick="event.stopPropagation()">
        <div class="digest-modal-header">
            <h2> News Digest Editor</h2>
            <button class="close-btn" style="position:static;" onclick="closeDigestModal(event)">&times;</button>
        </div>
        <div class="digest-modal-body">
            <!-- Left: editor -->
            <div class="editor-pane">
                <div class="field-group">
                    <label>標題</label>
                    <input id="d_title" type="text">
                    <label>發生時間</label>
                    <textarea id="d_date" rows="2"></textarea>
                    <label>影響範圍</label>
                    <textarea id="d_scope" rows="2"></textarea>
                    <label>潛在影響</label>
                    <textarea id="d_impact" rows="3"></textarea>
                    <label>重點整理</label>
                    <textarea id="d_summary" rows="6"></textarea>
                    <label>新聞網址</label>
                    <input id="d_url" type="text">
                </div>
            </div>
            <!-- Right: similarity -->
            <div class="similarity-pane">
                <h3>Customer Similarity (Top 20)</h3>
                <div id="similarityChart">
                    <div style="color:var(--text-muted);font-size:13px;">Loading...</div>
                </div>
                <p class="similarity-source">Source: Word2Vec Similarity</p>
            </div>
        </div>
        <div class="digest-modal-footer">
            <button class="btn btn-secondary" onclick="copyDigest()">Copy Summary</button>
            <button id="addToQueueBtn" class="btn btn-success" onclick="addToQueue()">加入週報 (1/3)</button>
        </div>
    </div>
</div>

<!-- Email Preview Modal -->
<div class="modal-overlay" id="previewModal" onclick="closePreviewModal(event)">
    <div class="digest-modal-content" onclick="event.stopPropagation()" style="max-width:720px;">
        <div class="digest-modal-header">
            <h2>📧 Email Preview</h2>
            <button class="close-btn" style="position:static;" onclick="closePreviewModal(event)">&times;</button>
        </div>
        <iframe id="previewFrame" style="flex:1;width:100%;border:none;background:white;"></iframe>
        <div class="digest-modal-footer">
            <button class="btn btn-secondary" onclick="closePreviewModal(event)">取消</button>
            <button id="confirmDispatchBtn" class="btn btn-success" onclick="confirmDispatch()">✅ Dispatch</button>
        </div>
    </div>
</div>

<script>
    const API_URL        = 'http://localhost:8001/api/news';
    const N8N_WEBHOOK    = 'http://localhost:5678/webhook/cyber-news';
    const RENDER_URL     = 'http://localhost:8002/render';
    const DISPATCHER_URL = 'http://localhost:8080/app/v1';

    let globalNewsData = [];
    let pendingHtml = null;

    // ===== FEED =====
    async function loadFeed() {
        try {
            const res = await fetch(API_URL);
            if (!res.ok) throw new Error('API ERROR');
            const { data } = await res.json();
            globalNewsData = data;

            if (data.length === 0) {
                feed.innerHTML = '<div class="loading">No alerts yet.</div>';
                return;
            }

            const queue = getQueue();
            const queueUrls = queue.map(e => e.url);

            document.getElementById('feed').innerHTML = data.map((item, index) => {
                const tags = (item.categories || item.categoies || []).map(t => `<span class="tag">${t}</span>`).join('');
                const inQueue = queueUrls.includes(item.link);
                const queueNum = inQueue ? queueUrls.indexOf(item.link) + 1 : '';
                return `
                    <div class="card ${inQueue ? 'in-queue' : ''}" onclick="openNewsModal(${index})">
                        <div class="queue-badge">${queueNum}</div>
                        <div class="tag-container">${tags}</div>
                        <div class="title">${item.title}</div>
                        <div class="summary">${item.summary}</div>
                    </div>`;
            }).join('');

            document.getElementById('statusText').innerText = `Live Threat Feed • ${data.length} Alerts Active`;
            updateQueueBar();
        } catch (err) {
            console.error(err);
            document.getElementById('statusText').innerText = 'Live Threat Feed • Connection Offline';
            document.getElementById('statusText').style.color = '#ff4d4d';
        }
    }

    // ===== QUEUE =====
    function getQueue() {
        return JSON.parse(localStorage.getItem('digestQueue') || '[]');
    }
    function saveQueue(q) {
        localStorage.setItem('digestQueue', JSON.stringify(q));
    }
    function clearQueue() {
        if (!confirm('clean queue？')) return;
        localStorage.removeItem('digestQueue');
        loadFeed();
    }
    function updateQueueBar() {
        const queue = getQueue();
        for (let i = 0; i < 3; i++) {
            const slot = document.getElementById(`slot${i}`);
            if (queue[i]) {
                slot.classList.add('filled');
                slot.innerText = '✓';
                slot.title = queue[i].title[0] || '';
            } else {
                slot.classList.remove('filled');
                slot.innerText = i + 1;
                slot.title = '';
            }
        }
        // update add button label
        const btn = document.getElementById('addToQueueBtn');
        if (btn) {
            const count = queue.length;
            if (count >= 3) {
                btn.innerText = 'already 3 alerts';
                btn.disabled = true;
            } else if (count === 2) {
                btn.innerText = `add news & dispatch (3/3)`;
                btn.disabled = false;
            } else {
                btn.innerText = `add news (${count + 1}/3)`;
                btn.disabled = false;
            }
        }
    }

    // ===== NEWS PREVIEW MODAL =====
    function openNewsModal(index) {
        const item = globalNewsData[index];
        if (!item) return;
        const tags = (item.categories || item.categoies || []).map(t => `<span class="tag">${t}</span>`).join('');
        document.getElementById('modalTags').innerHTML = tags;
        document.getElementById('modalTitle').innerText = item.title;
        document.getElementById('modalSummary').innerText = item.summary;
        document.getElementById('modalSourceLink').href = item.link;

        const btn = document.getElementById('analyzeBtn');
        btn.innerHTML = 'Analyze and Generate Digest';
        btn.disabled = false;
        btn.onclick = () => triggerAnalysis(item.link);

        document.getElementById('newsModal').classList.add('active');
    }
    function closeNewsModal(e) {
        if (e) e.preventDefault();
        document.getElementById('newsModal').classList.remove('active');
    }

    // ===== TRIGGER ANALYSIS (fetch, not redirect) =====
    async function triggerAnalysis(url) {
        const btn = document.getElementById('analyzeBtn');
        if (!url || !url.startsWith('http')) { alert('Invalid URL'); return; }

        btn.innerHTML = '⏳ Analyzing...';
        btn.disabled = true;

        try {
            const finalUrl = `${N8N_WEBHOOK}?NewsUrl=${encodeURIComponent(url)}`;
            const res = await fetch(finalUrl);
            if (!res.ok) throw new Error('n8n error: ' + res.status);
            const json = await res.json();

            // n8n Respond to Webhook 改成回傳 JSON:
            // { data: { title, keywords, date[], scope[], impact[], summary[], url }, similarity: {...} }
            closeNewsModal(null);
            openDigestModal(json);
        } catch (err) {
            alert('Analysis failed:\n' + err.message);
            btn.innerHTML = 'Analyze and Generate Digest';
            btn.disabled = false;
        }
    }

    // ===== DIGEST EDITOR MODAL =====
    function openDigestModal(json) {
        const d = json.data || {};
        const sim = json.similarity || {};

        document.getElementById('d_title').value   = d.title   || '';
        document.getElementById('d_date').value    = (d.date   || []).join('\n');
        document.getElementById('d_scope').value   = (d.scope  || []).join('\n');
        document.getElementById('d_impact').value  = (d.impact || []).join('\n');
        document.getElementById('d_summary').value = (d.summary|| []).join('\n');
        document.getElementById('d_url').value     = d.url     || '';

        renderSimilarityChart(sim);
        updateQueueBar();
        document.getElementById('digestModal').classList.add('active');
    }
    function closeDigestModal(e) {
        if (e) e.preventDefault();
        document.getElementById('digestModal').classList.remove('active');
    }

    function renderSimilarityChart(scores) {
        const container = document.getElementById('similarityChart');
        if (!scores || Object.keys(scores).length === 0) {
            container.innerHTML = '<div style="color:var(--text-muted);font-size:13px;">No similarity data</div>';
            return;
        }
        const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]).slice(0, 20);
        container.innerHTML = sorted.map(([name, score]) => {
            const high = score > 0.5;
            const color = high ? 'var(--success)' : 'var(--text-secondary)';
            const bar   = high ? 'var(--success)' : 'var(--accent)';
            return `
            <div class="customer-card">
                <div class="label-row">
                    <span class="label-name">${name}</span>
                    <span style="color:${color};font-weight:600;">${(score*100).toFixed(2)}%</span>
                </div>
                <div class="progress-container">
                    <div class="progress-fill" style="width:${score*100}%;background:${bar}"></div>
                </div>
            </div>`;
        }).join('');
    }

    // ===== COLLECT PAYLOAD =====
    function collectPayload() {
        const lines = (id) => document.getElementById(id).value
            .split('\n').map(l => l.trim()).filter(Boolean);
        return {
            title:   [document.getElementById('d_title').value.trim()],
            date:    lines('d_date'),
            scope:   lines('d_scope'),
            impact:  lines('d_impact'),
            summary: lines('d_summary'),
            url:     document.getElementById('d_url').value.trim() || '#',
        };
    }

    function copyDigest() {
        const p = collectPayload();
        const text = `標題: ${p.title[0]}\n\n發生時間:\n${p.date.join('\n')}\n\n影響範圍:\n${p.scope.join('\n')}\n\n潛在影響:\n${p.impact.join('\n')}\n\n重點整理:\n${p.summary.join('\n')}\n\n網址: ${p.url}`;
        navigator.clipboard.writeText(text).then(() => alert('Copied!'));
    }

    // ===== ADD TO QUEUE =====
    async function addToQueue() {
        const payload = collectPayload();
        if (!payload.title[0]) { alert('title can not be NULL！'); return; }

        const queue = getQueue();
        if (queue.length >= 3) { alert('Queue Full'); return; }

        queue.push(payload);
        saveQueue(queue);

        if (queue.length < 3) {
            // 前兩篇：存完關 modal，更新 UI
            closeDigestModal(null);
            loadFeed();
            return;
        }

        // 第三篇：render → 預覽
        const btn = document.getElementById('addToQueueBtn');
        btn.innerHTML = '⏳ Rendering...';
        btn.disabled = true;

        try {
            const renderRes = await fetch(RENDER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ events: queue })
            });
            if (!renderRes.ok) throw new Error('Render failed: ' + renderRes.status);
            const { html } = await renderRes.json();

            pendingHtml = html;
            closeDigestModal(null);
            openPreviewModal(html);

            btn.innerHTML = 'add news & dispatch (3/3)';
            btn.disabled = false;
        } catch (err) {
            alert('Render fail：\n' + err.message);
            queue.pop();
            saveQueue(queue);
            updateQueueBar();
            btn.innerHTML = 'add news & dispatch (3/3)';
            btn.disabled = false;
        }
    }
    // ===== SETTINGS =====

    // ===== PREVIEW MODAL =====
    function openPreviewModal(html) {
        document.getElementById('previewFrame').srcdoc = html;
        document.getElementById('previewModal').classList.add('active');
    }
    function closePreviewModal(e) {
        if (e) e.preventDefault();
        document.getElementById('previewModal').classList.remove('active');
    }
    async function confirmDispatch() {
        if (!pendingHtml) return;
        const btn = document.getElementById('confirmDispatchBtn');
        btn.innerHTML = '⏳ Dispatching...';
        btn.disabled = true;
        try {
            const dispatchRes = await fetch(DISPATCHER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ html: pendingHtml })
            });
            if (!dispatchRes.ok) throw new Error('Dispatch failed: ' + dispatchRes.status);
            pendingHtml = null;
            localStorage.removeItem('digestQueue');
            alert('dispatch successful！');
            closePreviewModal(null);
            loadFeed();
        } catch (err) {
            alert('Dispatch fail：\n' + err.message);
            btn.innerHTML = 'confirm to dispatch';
            btn.disabled = false;
        }
    }

    function toggleSettings() {
        const panel = document.getElementById('settingsPanel');
        panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        if (panel.style.display === 'block') refreshSourceList();
    }
    async function refreshSourceList() {
        const listDiv = document.getElementById('sourceList');
        try {
            const res = await fetch('http://localhost:8001/api/rss-sources');
            const data = await res.json();
            listDiv.innerHTML = data.map(src => `
                <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);">
                    <span style="font-size:14px;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70%;">${src.url}</span>
                    <button onclick="deleteSource('${src.url}')" style="width:auto;padding:6px 12px;background:#3d1c1c;border:none;color:white;border-radius:4px;font-size:12px;cursor:pointer;">Delete</button>
                </div>`).join('') || '<div style="color:var(--text-muted)">No sources configured.</div>';
        } catch (err) {
            listDiv.innerHTML = '<div style="color:var(--danger)">Failed to load sources.</div>';
        }
    }
    async function addNewRss() {
        const input = document.getElementById('newRssUrl');
        const url = input.value.trim();
        if (!url || !url.startsWith('http')) { alert('Invalid HTTP/HTTPS URL'); return; }
        try {
            const res = await fetch('http://localhost:8001/api/rss-sources', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url })
            });
            const result = await res.json();
            if (result.status === 'success') { alert('Added!'); input.value = ''; refreshSourceList(); }
            else alert('Failed: ' + result.message);
        } catch (err) { alert('API connection failed'); }
    }
    async function deleteSource(url) {
        if (!confirm('Remove this source?')) return;
        try {
            const res = await fetch('http://localhost:8001/api/rss-sources', {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url })
            });
            if (res.ok) refreshSourceList();
        } catch (err) { alert('Delete failed'); }
    }

    // ===== INIT =====
    loadFeed();
    setInterval(loadFeed, 30000);
</script>
</body>
