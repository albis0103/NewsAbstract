<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecOps Intelligence - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f1117;
            --bg-card: #21242f;
            --bg-input: #181b24;
            --border: #2a2e3b;
            --text-primary: #e8eaed;
            --text-secondary: #9aa0ab;
            --text-muted: #6b7280;
            --accent: #288bc4;
            --radius: 10px;
            --radius-sm: 6px;
            --shadow: 0 8px 30px rgba(0,0,0,0.5);
            --transition: 0.2s ease;
        }

        * {box-sizing: border-box; margin: 0; padding: 0;}
        
        body {
            font-family: 'Inter', -apple-system, sans-serif; 
            background: var(--bg-primary); 
            color: var(--text-primary);
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        .header { text-align: center; margin-bottom: 40px; }
        .logo { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        .status { color: var(--accent); font-size: 13px; font-weight: 500; }

        /*CSS Grid*/
        #feed {
            display: grid;
            grid-template-columns: repeat(3, 1fr);/*一排顯示三個*/
            gap: 24px;
            width: 100%;
        }

        .card { 
            background: var(--bg-card); 
            padding: 24px; 
            border: 1px solid var(--border);
            border-radius: var(--radius); 
            box-shadow: var(--shadow); 
            text-align: left;
            transition: transform var(--transition), border-color var(--transition);
            display: flex;
            flex-direction: column;
            height: 100%;
            cursor: pointer; /* 滑鼠移過去變手指*/
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
        }

        .tag-container { margin-bottom: 12px; }
        .tag {
            background: rgba(40, 139, 196, 0.1);
            color: var(--accent);
            border: 1px solid rgba(40, 139, 196, 0.2);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            margin-right: 6px;
            text-transform: uppercase;
            display: inline-block;
            margin-bottom: 4px;
        }

        .title { font-size: 16px; font-weight: 600; margin-bottom: 10px; line-height: 1.4; }
        .summary {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3; 
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .modal-overlay {
            display: none; /*預設隱藏*/
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center; 
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;/*半透明*/
            opacity: 1;
        }

        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            width: 90%;
            max-width: 600px;
            padding: 32px;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .close-btn {
            position: absolute;
            top: 20px; right: 24px;
            background: none; border: none;
            color: var(--text-muted);
            font-size: 24px; cursor: pointer;
            transition: color var(--transition);
        }
        .close-btn:hover { color: var(--text-primary); }

        .modal-title { font-size: 20px; font-weight: 600; margin-bottom: 16px; line-height: 1.4; padding-right: 20px;}
        .modal-body { color: var(--text-secondary); font-size: 15px; line-height: 1.6; margin-bottom: 24px; max-height: 50vh; overflow-y: auto;}
        
        /* 完美移植你原本的按鈕設計 */
        .action-btn { 
            background: linear-gradient(135deg, var(--accent), #1e6fa0); 
            color: white; 
            border: none; 
            padding: 14px 24px; 
            border-radius: var(--radius-sm); 
            font-size: 15px; 
            font-weight: 600;
            font-family: inherit;
            cursor: pointer; 
            transition: all var(--transition); 
            width: 100%; 
            display: block;
            text-align: center;
        }

        .action-btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .action-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .source-link {
            display: block; text-align: center; margin-top: 16px;
            color: var(--text-muted); font-size: 13px; text-decoration: underline;
        }
        .source-link:hover { color: var(--text-primary); }

        /* RWD */
        @media (max-width: 992px) { #feed { grid-template-columns: repeat(2, 1fr); } }/*平板變兩個*/
        @media (max-width: 600px) { #feed { grid-template-columns: 1fr; } }/*手機變一個*/
        .loading { grid-column: 1 / -1; text-align: center; color: var(--text-muted); margin-top: 50px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">SecOps AI Intelligence</div>
            <div class="status" id="statusText">Live Threat Feed • Updating...</div>
            <button onclick="toggleSettings()" class="action-btn" style="width: auto; margin-top: 20px; font-size: 13px; padding: 10px 20px; background: var(--bg-input); border: 1px solid var(--border);">
                ⚙️ Manage RSS Sources
            </button>
        </div>
        
        <div id="settingsPanel" style="display: none; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 40px; width: 100%; max-width: 800px; animation: fadeIn 0.3s ease;">
            <h3 style="font-size: 18px; margin-bottom: 20px;">Source Management</h3>
            
            <div style="display: flex; gap: 10px; margin-bottom: 24px;">
                <input type="text" id="newRssUrl" placeholder="https://example.com/rss..." style="margin-bottom: 0; background: var(--bg-input); flex: 1;">
                <button onclick="addNewRss()" style="width: auto; padding: 0 20px;">Add Source</button>
            </div>
        
            <div id="sourceList" style="border-top: 1px solid var(--border); padding-top: 20px;">
                <div class="loading" style="margin-top: 0;">Loading sources...</div>
            </div>
        </div>
        <div id="feed"><div class="loading">Fetching data...</div></div>
    </div>

    <div class="modal-overlay" id="newsModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeModal(event)">&times;</button>
            <div id="modalTags" class="tag-container"></div>
            <div id="modalTitle" class="modal-title"></div>
            <div id="modalSummary" class="modal-body"></div>
            
            <button id="analyzeBtn" class="action-btn">Analyze and Generate Digest</button>
            <a id="modalSourceLink" href="#" target="_blank" class="source-link">Read Original Article</a>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8001/api/news'; // 請確認你的 API Port 與路徑
        const feed = document.getElementById('feed');
        const statusText = document.getElementById('statusText');
        const modal = document.getElementById('newsModal');
        
        // 用一個全域變數快取新聞資料，方便 Modal 讀取
        let globalNewsData = [];
        /*loodfeed():請求後資料存進globalnewsdata(buffer)
            data.map():loop each record 包裝成html
        */
        async function loadFeed() {
            try {
                const res = await fetch(API_URL);
                if(!res.ok) throw new Error('API ERROR');
                
                const {data} = await res.json();
                globalNewsData = data; // 存入快取
                
                if(data.length === 0){
                    feed.innerHTML = '<div class="loading">No alerts yet.</div>';
                    return;
                }
                
                feed.innerHTML = data.map((item, index) => {
                    const tags = (item.categories || item.categoies || []).map(t => `<span class="tag">${t}</span>`).join('');
                    // 加入 onclick 事件，傳入 index
                    return `
                        <div class="card" onclick="openModal(${index})">
                            <div class="tag-container">${tags}</div>
                            <div class="title">${item.title}</div>
                            <div class="summary">${item.summary}</div>
                        </div>
                    `;
                }).join('');

                statusText.innerText = `Live Threat Feed • ${data.length} Alerts Active`;
            } catch (err) {
                console.error(err);
                statusText.innerText = 'Live Threat Feed • Connection Offline';
                statusText.style.color = '#ff4d4d';
            }
        }

        function toggleSettings(){
            const panel = document.getElementById('settingsPanel');
            panel.style.display = panel.style.display == 'none'? 'block':'none';
            if(panel.style.display == 'block') refreshSourceList();
        }
        async function refreshSourceList(){
            const listDiv = document.getElementById('sourceList');
            try{
                const res = await fetch('http://localhost:8001/api/rss-sources');
                const data = await res.json()
                
                listDiv.innerHTML = data.map(src=>`
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border);">
                    <span style="font-size: 14px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 70%;">${src.url}</span>
                    <button onclick="deleteSource('${src.url}')" style="width: auto; padding: 6px 12px; background: #3d1c1c; font-size: 12px;">Delete</button>
                </div>
                `).join('')||'<div class="text-muted">No sources configured.</div>';
            } catch (err) {
                listDiv.innerHTML = '<div class="text-danger">Failed to load sources.</div>';
    
            }
        }
        async function addNewRss(){
            // 確保是 getElementById，不是 getElementsById
            const input = document.getElementById('newRssUrl');
            const url = input.value.trim();

            if(!url || !url.startsWith('http')){
                alert('error format for HTTP/HTTPS RSS url');
                return;
            }
            try {
                const res = await fetch('http://localhost:8001/api/rss-sources', {
                    method:'POST', 
                    headers:{'Content-Type':'application/json'}, 
                    body:JSON.stringify({url:url})
                });
                const result = await res.json();
                if(result.status === 'success'){
                    alert('insert success')
                    input.value = '';
                    refreshSourceList();
                }else{
                    alert('insert failure'+ result.message);
                }
            } catch (error) {
                console.error(error);
                alert('api connect failure');
            }
        }
        async function deleteSource(url){
            if(!confirm('Are you sure want remove this source?'))return;
            try{
                const res = await fetch('http://localhost:8001/api/rss-sources', {
                    method:'DELETE', 
                    headers:{'Content-Type':'application/json'}, 
                    body:JSON.stringify({url:url})
                });
                if(res.ok) refreshSourceList();
            }catch(err){
                alert('Delete failed');
            }
        }

        // 開啟 Modal 並填入資料
        function openModal(index) {
            const item = globalNewsData[index];
            if(!item) return;

            const tags = (item.categories || item.categoies || []).map(t => `<span class="tag">${t}</span>`).join('');
            
            document.getElementById('modalTags').innerHTML = tags;
            document.getElementById('modalTitle').innerText = item.title;
            document.getElementById('modalSummary').innerText = item.summary; // 這裡顯示完整摘要
            document.getElementById('modalSourceLink').href = item.link;

            // 綁定你原本的 analyze 邏輯到按鈕上
            const analyzeBtn = document.getElementById('analyzeBtn');
            analyzeBtn.innerHTML = 'Analyze and Generate Digest'; // 復原按鈕文字
            analyzeBtn.disabled = false; // 復原按鈕狀態
            analyzeBtn.onclick = () => triggerN8nAnalysis(item.link);

            modal.classList.add('active');
        }

        // 關閉 Modal
        function closeModal(e) {
            if (e) e.preventDefault();
            modal.classList.remove('active');
        }

        //前端的 n8n 邏輯】
        function triggerN8nAnalysis(url) {
            const btn = document.getElementById('analyzeBtn');
            
            if (!url || !url.startsWith('http')) {
                alert('Invalid URL format for analysis.');
                return;
            }

            // UX Optimization: Show loading state
            btn.innerHTML = '⏳ Analyzing... Please wait';
            btn.disabled = true;

            // Target n8n webhook
            const webhookUrl = "http://localhost:5678/webhook/cyber-news-analysis";
            const finalUrl = `${webhookUrl}?NewsUrl=${encodeURIComponent(url)}`;
            
            console.log("Redirecting to n8n webhook:", finalUrl);
            
            // 執行網頁跳轉 (觸發 webhook)
            window.location.href = finalUrl;
        }

        // 初始化與輪詢
        loadFeed();
        setInterval(loadFeed, 30000); // 30秒自動更新
    </script>
</body>
</html>
